name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tgz"